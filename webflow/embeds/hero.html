<!-- ═══════════════════════════════════════════════════════════════════════
     joolomee · Hero Section — Webflow Embed
     Full-bleed hero: availability pill, 3-line gradient headline, CTAs,
     floating crystal on the right (desktop). Reads i18n from body-code.html
     via [data-i18n] — falls back to the copy below.
     ═══════════════════════════════════════════════════════════════════════ -->
<section class="jlm-hero jlm-spotlight jlm-grid-dots">
  <!-- Background orbs -->
  <div class="jlm-hero__orb jlm-hero__orb--tl"></div>
  <div class="jlm-hero__orb jlm-hero__orb--br"></div>
  <div class="jlm-hero__orb jlm-hero__orb--crystal"></div>

  <div class="jlm-hero__content">
    <div class="jlm-hero__grid">
      <!-- Crystal (mobile: top) -->
      <div class="jlm-hero__crystal jlm-hero__crystal--mobile">
        <div class="jlm-crystal" data-size="140" data-color="#E8787A" data-animate="true"></div>
      </div>

      <!-- Text -->
      <div class="jlm-hero__text">
        <div class="jlm-hero__badge-wrap">
          <span class="jlm-hero__badge">
            <span class="jlm-hero__pulse">
              <span class="jlm-hero__pulse-ping"></span>
              <span class="jlm-hero__pulse-dot"></span>
            </span>
            <span data-i18n="hero.badge">Disponível para novos projetos</span>
          </span>
        </div>

        <div class="jlm-hero__title-wrap">
          <h1 class="jlm-hero__title jlm-hero__title--light" data-i18n="hero.title1">Olá! Sou a designer</h1>
          <h1 class="jlm-hero__title jlm-hero__title--gradient jlm-gradient-text" data-i18n="hero.title2">que a tua marca</h1>
          <h1 class="jlm-hero__title jlm-hero__title--light" data-i18n="hero.title3">estava à procura.</h1>
        </div>

        <p class="jlm-hero__subtitle" data-i18n="hero.subtitle">
          Full Stack Designer &amp; Brand Strategist em Portugal. Crio marcas do zero,
          desenho interfaces e construo produtos digitais que ficam na memória.
        </p>

        <div class="jlm-hero__ctas">
          <a href="#work" class="jlm-hero__btn jlm-hero__btn--primary" data-cursor="hover">
            <span data-i18n="hero.cta1">Ver Trabalho</span>
            <span class="jlm-hero__arrow" aria-hidden="true">&rarr;</span>
          </a>
          <a href="#contact" class="jlm-hero__btn jlm-hero__btn--ghost" data-cursor="hover">
            <span data-i18n="hero.cta2">Falar Comigo</span>
          </a>
        </div>
      </div>

      <!-- Crystal (desktop: right) -->
      <div class="jlm-hero__crystal jlm-hero__crystal--desktop">
        <div class="jlm-hero__rings">
          <span class="jlm-hero__ring jlm-hero__ring--a"></span>
          <span class="jlm-hero__ring jlm-hero__ring--b"></span>
        </div>
        <div class="jlm-crystal" data-size="320" data-color="#E8787A" data-animate="true"></div>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="jlm-hero__scroll" aria-hidden="true">
    <span class="jlm-hero__scroll-label">Scroll</span>
    <div class="jlm-hero__mouse">
      <span class="jlm-hero__mouse-dot"></span>
    </div>
  </div>
</section>

<style>
  .jlm-hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
    font-family: var(--jlm-sans, "Inter", system-ui, sans-serif);
    color: var(--jlm-fg, #f5f5f5);
  }

  /* Orbs */
  .jlm-hero__orb { position: absolute; pointer-events: none; border-radius: 50%; filter: blur(120px); }
  .jlm-hero__orb--tl {
    top: 25%; left: -160px;
    width: 500px; height: 500px;
    background: rgba(232, 120, 122, 0.08);
    filter: blur(150px);
  }
  .jlm-hero__orb--br {
    bottom: 25%; right: -160px;
    width: 400px; height: 400px;
    background: rgba(242, 165, 167, 0.06);
  }
  .jlm-hero__orb--crystal {
    display: none;
    top: 50%; right: 10%;
    width: 600px; height: 600px;
    transform: translateY(-50%);
    background: linear-gradient(135deg, rgba(232,120,122,0.10), rgba(242,165,167,0.05) 60%, transparent);
    filter: blur(160px);
  }
  @media (min-width: 1024px) { .jlm-hero__orb--crystal { display: block; } }

  /* Content grid */
  .jlm-hero__content {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 96px 16px 64px;
  }
  @media (min-width: 640px)  { .jlm-hero__content { padding-left: 24px; padding-right: 24px; } }
  @media (min-width: 1024px) { .jlm-hero__content { padding: 0 24px; } }

  .jlm-hero__grid {
    display: flex; flex-direction: column; align-items: center;
    gap: 40px;
  }
  @media (min-width: 1024px) {
    .jlm-hero__grid { flex-direction: row; gap: 64px; align-items: center; }
  }

  /* Crystal slots */
  .jlm-hero__crystal { position: relative; flex-shrink: 0; }
  .jlm-hero__crystal--mobile  { display: flex; }
  .jlm-hero__crystal--desktop { display: none; align-items: center; justify-content: center; }
  @media (min-width: 1024px) {
    .jlm-hero__crystal--mobile  { display: none; }
    .jlm-hero__crystal--desktop { display: flex; }
  }

  .jlm-hero__rings {
    position: absolute; inset: 0;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .jlm-hero__ring {
    position: absolute; border-radius: 50%;
    width: 100%; height: 100%;
  }
  .jlm-hero__ring--a {
    border: 1px solid rgba(232, 120, 122, 0.2);
    transform: scale(1.25);
    animation: jlm-hero-ring 4s ease-in-out infinite;
  }
  .jlm-hero__ring--b {
    border: 1px solid rgba(232, 120, 122, 0.1);
    transform: scale(1.5);
    animation: jlm-hero-ring 5s ease-in-out 0.5s infinite;
  }
  @keyframes jlm-hero-ring {
    0%, 100% { transform: scale(1.25); opacity: 0.15; }
    50%      { transform: scale(1.35); opacity: 0.25; }
  }

  /* Text */
  .jlm-hero__text {
    flex: 1 1 auto;
    text-align: center;
    max-width: 672px;
  }
  @media (min-width: 1024px) { .jlm-hero__text { text-align: left; } }

  .jlm-hero__badge-wrap { margin-bottom: 32px; }
  .jlm-hero__badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    border-radius: 9999px;
    border: 1px solid var(--jlm-border, #1e1e1e);
    background: rgba(17, 17, 17, 0.5);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    font-size: 0.875rem;
    color: var(--jlm-muted, #8a8a8a);
  }
  .jlm-hero__pulse { position: relative; display: inline-flex; width: 8px; height: 8px; }
  .jlm-hero__pulse-ping, .jlm-hero__pulse-dot {
    position: absolute; inset: 0; border-radius: 50%;
  }
  .jlm-hero__pulse-ping {
    background: #4ade80; opacity: 0.75;
    animation: jlm-hero-ping 1.5s cubic-bezier(0,0,0.2,1) infinite;
  }
  .jlm-hero__pulse-dot { background: #22c55e; }
  @keyframes jlm-hero-ping { 75%, 100% { transform: scale(2); opacity: 0; } }

  .jlm-hero__title-wrap { margin-bottom: 32px; }
  .jlm-hero__title {
    font-size: clamp(2.25rem, 6vw, 5.2rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .jlm-hero__title--light    { font-weight: 300; color: var(--jlm-fg, #f5f5f5); }
  .jlm-hero__title--gradient { font-weight: 700; }

  .jlm-hero__subtitle {
    font-size: clamp(1rem, 1.4vw, 1.25rem);
    color: var(--jlm-muted, #8a8a8a);
    max-width: 560px;
    line-height: 1.6;
    margin: 0 auto 40px;
  }
  @media (min-width: 1024px) { .jlm-hero__subtitle { margin-left: 0; } }

  .jlm-hero__ctas {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  @media (min-width: 640px)  { .jlm-hero__ctas { flex-direction: row; } }
  @media (min-width: 1024px) { .jlm-hero__ctas { justify-content: flex-start; } }

  .jlm-hero__btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 16px 32px;
    border-radius: 9999px;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.25s ease, background-color 0.3s ease,
                border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
  }
  .jlm-hero__btn:hover { transform: scale(1.04); }
  .jlm-hero__btn--primary {
    background: var(--jlm-coral, #e8787a);
    color: var(--jlm-bg, #0a0a0a);
    box-shadow: 0 8px 24px rgba(232, 120, 122, 0.2);
  }
  .jlm-hero__btn--primary:hover {
    background: var(--jlm-coral-lt, #f2a5a7);
    box-shadow: 0 0 40px rgba(232, 120, 122, 0.3);
  }
  .jlm-hero__btn--ghost {
    border: 1px solid var(--jlm-border, #1e1e1e);
    color: var(--jlm-fg, #f5f5f5);
  }
  .jlm-hero__btn--ghost:hover { color: var(--jlm-coral, #e8787a); border-color: rgba(232,120,122,0.5); }
  .jlm-hero__arrow { animation: jlm-hero-arrow 1.5s ease-in-out infinite; display: inline-block; }
  @keyframes jlm-hero-arrow { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }

  /* Scroll indicator */
  .jlm-hero__scroll {
    position: absolute; bottom: 32px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    opacity: 0;
    animation: jlm-hero-fadein 0.8s ease 2.5s forwards;
  }
  @keyframes jlm-hero-fadein { to { opacity: 1; } }
  .jlm-hero__scroll-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--jlm-muted, #8a8a8a);
    animation: jlm-hero-blink 2s ease-in-out infinite;
  }
  @keyframes jlm-hero-blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
  .jlm-hero__mouse {
    width: 20px; height: 32px;
    border-radius: 9999px;
    border: 1px solid var(--jlm-border, #1e1e1e);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 6px;
  }
  .jlm-hero__mouse-dot {
    width: 4px; height: 6px;
    border-radius: 9999px;
    background: var(--jlm-coral, #e8787a);
    animation: jlm-hero-mouse 2s ease-in-out infinite;
  }
  @keyframes jlm-hero-mouse {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50%      { transform: translateY(8px); opacity: 0.3; }
  }

  @media (prefers-reduced-motion: reduce) {
    .jlm-hero__ring--a, .jlm-hero__ring--b,
    .jlm-hero__pulse-ping, .jlm-hero__arrow,
    .jlm-hero__scroll-label, .jlm-hero__mouse-dot,
    .jlm-hero__scroll { animation: none !important; opacity: 1 !important; }
  }
</style>

<script>
/* Crystal renderer (inlined copy of crystal-logo.html, scoped via :not(rendered)) */
(function () {
  var wraps = document.currentScript.parentElement.querySelectorAll(".jlm-crystal:not([data-jlm-rendered])");
  if (!wraps.length) wraps = document.querySelectorAll(".jlm-crystal:not([data-jlm-rendered])");
  function render(el) {
    el.setAttribute("data-jlm-rendered", "");
    var size  = parseInt(el.getAttribute("data-size") || "160", 10);
    var color = el.getAttribute("data-color") || "#E8787A";
    var animate = el.getAttribute("data-animate") !== "false";
    var uid = "jlm-glow-" + Math.random().toString(36).slice(2, 8);
    var facets = [
      ["50,5 65,25 35,25", 0.95],
      ["50,5 35,25 18,45", 0.70],
      ["50,5 65,25 82,45", 0.85],
      ["35,25 18,45 30,55", 0.55],
      ["35,25 65,25 70,55 30,55", 0.75],
      ["65,25 82,45 70,55", 0.65],
      ["18,45 30,55 50,95", 0.60],
      ["30,55 50,65 50,95", 0.80],
      ["70,55 50,65 50,95", 0.90],
      ["82,45 70,55 50,95", 0.50]
    ];
    var polys = facets.map(function (f) {
      return '<polygon points="' + f[0] + '" fill="' + color + '" opacity="' + f[1] + '"/>';
    }).join("");
    var lines =
      '<line x1="35" y1="25" x2="30" y2="55" stroke="' + color + '" stroke-width="0.5" opacity="0.3"/>' +
      '<line x1="65" y1="25" x2="70" y2="55" stroke="' + color + '" stroke-width="0.5" opacity="0.3"/>' +
      '<line x1="50" y1="65" x2="50" y2="95" stroke="' + color + '" stroke-width="0.5" opacity="0.2"/>' +
      '<line x1="30" y1="55" x2="70" y2="55" stroke="' + color + '" stroke-width="0.5" opacity="0.2"/>' +
      '<line x1="50" y1="5"  x2="50" y2="65" stroke="' + color + '" stroke-width="0.3" opacity="0.15"/>';
    el.innerHTML =
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" ' +
      'fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="joolomee crystal">' +
        '<defs><filter id="' + uid + '" x="-50%" y="-50%" width="200%" height="200%">' +
          '<feGaussianBlur stdDeviation="' + (animate ? 3 : 0) + '" result="b"/>' +
          '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>' +
        '</filter></defs>' +
        '<g filter="url(#' + uid + ')">' + polys + lines + '</g>' +
      '</svg>';
  }
  wraps.forEach(render);
})();

/* Local spotlight fallback (if body-code.html isn't installed) */
(function () {
  var scope = document.currentScript.parentElement;
  var el = scope.querySelector(".jlm-hero.jlm-spotlight");
  if (!el) return;
  el.addEventListener("mousemove", function (e) {
    var r = el.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width) * 100;
    var y = ((e.clientY - r.top)  / r.height) * 100;
    el.style.setProperty("--jlm-mx", x + "%");
    el.style.setProperty("--jlm-my", y + "%");
  }, { passive: true });
})();
</script>
