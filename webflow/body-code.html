  .jlm-cursor-ring {
    width: 40px;

  .jlm-cursor-ring.is-hover {

  var LOCALES = ["en", "pt", "es", "fr", "de"];
  var STORAGE_KEY = "joolomee-lang";

  function detectLocale() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved && LOCALES.indexOf(saved) !== -1) return saved;
    } catch (_) {}
    var nav = (navigator.language || "").toLowerCase();
    if (nav.indexOf("pt") === 0) return "pt";
    if (nav.indexOf("es") === 0) return "es";
    if (nav.indexOf("fr") === 0) return "fr";
    if (nav.indexOf("de") === 0) return "de";
    return "en";
  }

  function lookup(dict, path) {
    var parts = path.split(".");
    var cur = dict;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return null;
      cur = cur[parts[i]];
    }
    return cur == null ? null : cur;
  }

  function applyTranslations(locale) {
    var dict = T[locale] || T.en;
    // Text nodes
    var nodes = document.querySelectorAll("[data-i18n]");
    nodes.forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      var val = lookup(dict, key);
      if (val == null) val = lookup(T.en, key);
      if (val == null) return;
      if (el.hasAttribute("data-i18n-html")) {
        el.innerHTML = val;
      } else {
        el.textContent = val;
      }
    });
    // Attribute targets
    var attrNodes = document.querySelectorAll("[data-i18n-attr]");
    attrNodes.forEach(function (el) {
      var spec = el.getAttribute("data-i18n-attr") || "";
      spec.split(";").forEach(function (pair) {
        var p = pair.trim();
        if (!p) return;
        var idx = p.indexOf(":");
        if (idx < 0) return;
        var attr = p.slice(0, idx).trim();
        var key = p.slice(idx + 1).trim();
        var val = lookup(dict, key);
        if (val == null) val = lookup(T.en, key);
        if (val != null) el.setAttribute(attr, val);
      });
    });
    // Expose current dict + locale for embeds
    window.__JLM_LOCALE__ = locale;
    window.__JLM_T__ = dict;
    document.documentElement.setAttribute("lang", locale);
    // Lang-switcher active styling
    document.querySelectorAll("[data-lang]").forEach(function (btn) {
      btn.classList.toggle(
        "jlm-lang-active",
        btn.getAttribute("data-lang") === locale
      );
    });
    // Fire event so embeds can re-render
    document.dispatchEvent(
      new CustomEvent("jlm:locale", { detail: { locale: locale, t: dict } })
    );
  }

  function setLocale(locale) {
    if (LOCALES.indexOf(locale) === -1) return;
    try { localStorage.setItem(STORAGE_KEY, locale); } catch (_) {}
    applyTranslations(locale);
  }

  // Public API
  window.joolomee = window.joolomee || {};
  window.joolomee.setLocale = setLocale;
  window.joolomee.getLocale = function () { return window.__JLM_LOCALE__ || "en"; };
  window.joolomee.t = function (path) {
    var d = window.__JLM_T__ || T.en;
    var v = lookup(d, path);
    return v == null ? lookup(T.en, path) : v;
  };

  // Lang-switcher click delegation
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("[data-lang]");
    if (!btn) return;
    e.preventDefault();
    setLocale(btn.getAttribute("data-lang"));
  });

  /* ═══════════════════════════════════════════════
     CUSTOM CURSOR
     ═══════════════════════════════════════════════ */
  function initCursor() {
    if (window.matchMedia("(pointer: coarse)").matches) return;
    document.body.classList.add("jlm-has-cursor");

    var dot = document.createElement("div");
    dot.className = "jlm-cursor-dot";
    var ring = document.createElement("div");
    ring.className = "jlm-cursor-ring";
    document.body.appendChild(dot);
    document.body.appendChild(ring);

    var mx = -100, my = -100;
    var rx = -100, ry = -100;
    var rafId = null;

    function tick() {
      // Spring-lerp the ring toward the mouse
      rx += (mx - rx) * 0.18;
      ry += (my - ry) * 0.18;
      dot.style.transform =
        "translate(" + mx + "px," + my + "px) translate(-50%,-50%)";
      ring.style.transform =
        "translate(" + rx + "px," + ry + "px) translate(-50%,-50%)";
      rafId = requestAnimationFrame(tick);
    }

    document.addEventListener("mousemove", function (e) {
      mx = e.clientX;
      my = e.clientY;
      if (dot.style.opacity !== "1") {
        dot.style.opacity = "1";
        ring.style.opacity = "1";
      }
      if (rafId == null) tick();
    });
    document.addEventListener("mouseleave", function () {
      dot.style.opacity = "0";
      ring.style.opacity = "0";
    });
    document.addEventListener("mouseenter", function () {
      dot.style.opacity = "1";
      ring.style.opacity = "1";
    });

    function setHover(state) {
      ring.classList.toggle("is-hover", state);
    }
    var hoverSel =
      'a, button, input, textarea, select, [data-cursor="hover"]';
    document.addEventListener("mouseover", function (e) {
      if (e.target.closest && e.target.closest(hoverSel)) setHover(true);
    });
    document.addEventListener("mouseout", function (e) {
      if (e.target.closest && e.target.closest(hoverSel)) setHover(false);
    });
  }

  /* ═══════════════════════════════════════════════
     MOUSE-TRACKED SPOTLIGHT
     Any element with class .jlm-spotlight gets --jlm-mx/--jlm-my updated.
     ═══════════════════════════════════════════════ */
  function initSpotlight() {
    var targets = document.querySelectorAll(".jlm-spotlight");
    if (!targets.length) return;
    targets.forEach(function (el) {
      el.addEventListener(
        "mousemove",
        function (e) {
          var r = el.getBoundingClientRect();
          var x = ((e.clientX - r.left) / r.width) * 100;
          var y = ((e.clientY - r.top) / r.height) * 100;
          el.style.setProperty("--jlm-mx", x + "%");
          el.style.setProperty("--jlm-my", y + "%");
        },
        { passive: true }
      );
    });
  }

  /* ═══════════════════════════════════════════════
     BOOT
     ═══════════════════════════════════════════════ */
  function boot() {
    applyTranslations(detectLocale());
    initCursor();
    initSpotlight();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
